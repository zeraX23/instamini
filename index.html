<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PWA - Supabase</title>
    <!-- Memuat Supabase Library v2 langsung dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input, textarea, button { width: 100%; padding: 10px; box-sizing: border-box; }
        #statusMessage { font-size: 0.9em; margin-top: 10px; color: blue; }
        .error { color: red !important; }
        .success { color: green !important; }
    </style>
</head>
<body>

    <h2>Buat Postingan Baru</h2>
    
    <!-- Formulir Login Darurat (Karena tabel kita dilindungi RLS, harus login dulu) -->
    <div class="form-group" id="loginSection">
        <input type="email" id="emailInput" placeholder="Email untuk Login/Daftar">
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="loginAtauDaftar()">Login / Daftar</button>
    </div>

    <!-- Formulir Upload (Awalnya disembunyikan sampai user login) -->
    <div id="uploadSection" style="display: none;">
        <div class="form-group">
            <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
        </div>
        <div class="form-group">
            <textarea id="captionInput" placeholder="Tulis caption Anda..." rows="3"></textarea>
        </div>
        <button onclick="prosesUpload()" id="uploadBtn">Unggah Foto</button>
    </div>

    <p id="statusMessage"></p>

    <!-- Memuat file logika kita -->
    <script src="app.js"></script>
</body>
</html>
